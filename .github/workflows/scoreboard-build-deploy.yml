name: Scoreboard Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'data/**'
      - 'public/data/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'
  workflow_dispatch:
  workflow_run:
    workflows: ['Scoreboard Fetch Results']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commits via GITHUB_TOKEN don't trigger push workflows; use latest main.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run scoreboard:data
      - run: npm run scoreboard:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
